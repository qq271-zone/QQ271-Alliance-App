.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,12,18,.15),transparent 42%,rgba(3,12,18,.12));pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:1240px;margin:auto;padding:24px 20px 20px;display:flex;align-items:flex-end;min-height:265px}
.hero-title{background:rgba(76,31,52,.56);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.34);border-radius:18px;padding:14px 18px;max-width:600px}
.hero-title h1{font-size:clamp(20px,3vw,34px);margin:0 0 6px;letter-spacing:.02em}
.hero-title p{margin:0;color:#fff3f8;font-size:14px}
.toolbar-wrap{position:sticky;top:0;z-index:20;background:rgba(255,249,252,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.toolbar{max-width:1240px;margin:auto;padding:10px 16px;display:grid;grid-template-columns:minmax(180px,1fr) 265px minmax(250px,auto);gap:10px;align-items:center}
.sel,.btn,.input{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 12px;min-height:42px}
.sel{width:100%}
.btn{font-weight:700}
.btn.primary{background:linear-gradient(135deg,#f59ac2,#e86da5);border-color:#e77aaa;color:#fff}
.btn.gold{background:linear-gradient(135deg,#f3b4cf,#df79a6);border-color:#dfa0bb;color:#fff}
.btn.ghost{background:#fff}
.btn.danger{border-color:#efb5c5;background:#fff0f3;color:#b53e61}
.layout{max-width:1240px;margin:18px auto 90px;padding:0 16px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
.sidebar{position:sticky;top:74px;align-self:start;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,244,249,.98));border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.navbtn{width:100%;border:0;border-radius:12px;padding:12px 14px;background:transparent;color:var(--muted);text-align:left;margin:2px 0;font-weight:700}
.navbtn.active{background:#f7d7e6;color:#9a345e}
.main{min-width:0}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,247,251,.98));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:18px}
.panel h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);background:#fff9fc;border-radius:15px;padding:14px}
.stat .v{font-size:28px;font-weight:900;margin-top:6px}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.activity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.activity{border:1px solid var(--line);border-radius:15px;background:#fff9fc;padding:14px}
.activity .title{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.tag{font-size:11px;border-radius:999px;padding:4px 8px;background:#f8dce8;color:#9d4467;white-space:nowrap}
.tag.pending{background:#fff0d9;color:#a16d1b}
.tag.good{background:#ffe2ee;color:#b94072}
.progress{height:6px;border-radius:99px;background:#f4dbe6;margin-top:12px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#ef7fb0,#f5b7d2)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px 12px;border-bottom:1px solid #f4d5e3;text-align:left;font-size:13px}
th{position:sticky;top:0;background:#fff0f6;color:#8f5570;z-index:1}
tr:last-child td{border-bottom:0}
.rank{font-weight:900;color:var(--gold)}
.score{font-weight:900;color:#c56b91}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.member-card{border:1px solid var(--line);background:#fff9fc;border-radius:14px;padding:12px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 0;font-size:13px}
.kv span:last-child{font-weight:700}
textarea{width:100%;min-height:230px;border-radius:14px;border:1px solid var(--line);background:#fff;color:#5b3044;padding:12px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{width:100%}
.notice{border:1px solid #f0c8a0;background:#fff8ef;color:#926322;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.6}
.ok{border-color:#efb1cd;background:#fff0f6;color:#a33f6b}
.err{border-color:#efb6c2;background:#fff0f3;color:#b5425f}
.hidden{display:none!important}
.bottomnav{display:none}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}

function clone(x){ return JSON.parse(JSON.stringify(x)); }

function mergeSeedAdditionsIntoState(){
  if(!state?.alliances) return false;
  let changed=false;
  Object.entries(SEED.alliances||{}).forEach(([alliance,seedA])=>{
    if(!state.alliances[alliance]){ state.alliances[alliance]=clone(seedA); changed=true; return; }
    const a=state.alliances[alliance];
    if(!Array.isArray(a.roster)) a.roster=[];
    if(!Array.isArray(a.inactiveMembers)) a.inactiveMembers=[];
    if(!a.memberMeta || typeof a.memberMeta!=="object") a.memberMeta={};
    if(!a.weeks || typeof a.weeks!=="object") a.weeks={};
    const inactive=new Set(a.inactiveMembers||[]);
    (seedA.roster||[]).forEach(n=>{ if(!inactive.has(n) && !a.roster.includes(n)){ a.roster.push(n); changed=true; } });
    Object.entries(seedA.weeks||{}).forEach(([wk,seedW])=>{
      if(!a.weeks[wk]){ a.weeks[wk]=clone(seedW); changed=true; return; }
      Object.entries(seedW||{}).forEach(([activity,seedRows])=>{
        if(!Object.prototype.hasOwnProperty.call(a.weeks[wk],activity)){
          a.weeks[wk][activity]=clone(seedRows); changed=true;
        }
      });
    });
  });
  return changed;
}

// 昵称纠错表：只在对应同盟内生效，避免不同同盟同名成员被误合并。
const NAME_ALIASES = {
  "271超级一组": {
    "卢晨风": "户晨风",
    "永远のLi薄荷": "永远のLI薄荷"
  }
};

function canonicalName(alliance,name){
  const n=String(name??"").trim();
  return (NAME_ALIASES[alliance] && NAME_ALIASES[alliance][n]) || n;
}

function mergeDuplicateRecord(activity,a,b){
  if(activity==="每日祈福"){
    const ad=Number.isFinite(Number(a.days))?Number(a.days):-1;
    const bd=Number.isFinite(Number(b.days))?Number(b.days):-1;
    const ar=Number.isFinite(Number(a.raw))?Number(a.raw):-1;
    const br=Number.isFinite(Number(b.raw))?Number(b.raw):-1;
    const best=(bd>ad || (bd===ad && br>ar))?b:a;
    return {...best,name:a.name};
  }
  if(activity==="推进城"){
    const at=Number(a.total_wan||0), bt=Number(b.total_wan||0);
    const best=bt>at?b:a;
    const rankVals=[a.rank,b.rank].map(Number).filter(Number.isFinite);
    return {...best,name:a.name,rank:rankVals.length?Math.min(...rankVals):best.rank};
  }
  if(activity==="岛屿激斗"){
    const scoreVals=[a.score,b.score].map(Number).filter(Number.isFinite);
    return {
      ...a,...b,name:a.name,
      score:scoreVals.length?Math.max(...scoreVals):(b.score??a.score),
      attended:Boolean(a.attended||a.participated||b.attended||b.participated),
      participated:Boolean(a.participated||a.attended||b.participated||b.attended),
      full:Boolean(a.full||b.full)
    };
  }
  return {...a,...b,name:a.name};
}

function normalizePrayerDays(raw,days){
  const value=Number(raw);
  const hasExplicitDays = days !== null && days !== undefined && days !== "";
  const parsedDays = hasExplicitDays ? Number(days) : NaN;

  // 特殊满勤档优先。
  const fullMap={2800:7,2400:7,1400:7,1200:7};
  if(Object.prototype.hasOwnProperty.call(fullMap,value)) return fullMap[value];

  // 保留明确且有效的历史天数；但修复 V5.5 的“正贡献被误存成0天”。
  if(Number.isFinite(parsedDays) && (parsedDays>0 || value===0)) return parsedDays;

  // 普通贡献按200/天：200=1、400=2、600=3、800=4、1000=5。
  const normalMap={1000:5,800:4,600:3,400:2,200:1,0:0};
  if(Object.prototype.hasOwnProperty.call(normalMap,value)) return normalMap[value];

  return Number.isFinite(parsedDays) ? parsedDays : null;
}

function normalizeRecords(alliance,activity,records){
  const map=new Map(), order=[];
  (records||[]).forEach(rec=>{
    if(!rec || typeof rec!=="object") return;
    const name=canonicalName(alliance,rec.name);
    if(!name) return;
    const r={...rec,name};
    if(activity==="每日祈福") r.days=normalizePrayerDays(r.raw,r.days);
    // 岛屿激斗导入名单本身就代表“已参加”；score 只保存贡献值，不自动判定“全程”。
    if(activity==="岛屿激斗" && (r.score!=null || r.attended || r.participated || r.full)){
      if(r.attended==null && r.participated==null){ r.attended=true; r.participated=true; }
      else if(r.attended==null){ r.attended=Boolean(r.participated); }
      else if(r.participated==null){ r.participated=Boolean(r.attended); }
    }
    if(!map.has(name)){ map.set(name,r); order.push(name); }
    else map.set(name,mergeDuplicateRecord(activity,map.get(name),r));
  });
  return order.map(n=>map.get(n));
}

function normalizeState(){
  if(!state || !state.alliances) return false;
  let changed=false;
  Object.entries(state.alliances).forEach(([alliance,a])=>{
    if(!Array.isArray(a.roster)){ a.roster=[]; changed=true; }
    if(!Array.isArray(a.inactiveMembers)){ a.inactiveMembers=[]; changed=true; }
    if(!a.memberMeta || typeof a.memberMeta!=="object"){ a.memberMeta={}; changed=true; }
    if(!a.weeks || typeof a.weeks!=="object"){ a.weeks={}; changed=true; }
    const active=[...new Set(a.roster.map(n=>canonicalName(alliance,n)).filter(Boolean))];
    const activeSet=new Set(active);
    const inactive=[...new Set(a.inactiveMembers.map(n=>canonicalName(alliance,n)).filter(n=>n && !activeSet.has(n)))];
    const sortedActive=active.sort((x,y)=>x.localeCompare(y,"zh-CN"));
    const sortedInactive=inactive.sort((x,y)=>x.localeCompare(y,"zh-CN"));
    if(JSON.stringify(a.roster)!==JSON.stringify(sortedActive)){ a.roster=sortedActive; changed=true; }
    if(JSON.stringify(a.inactiveMembers)!==JSON.stringify(sortedInactive)){ a.inactiveMembers=sortedInactive; changed=true; }
    Object.values(a.weeks||{}).forEach(w=>{
      Object.keys(w||{}).forEach(activity=>{
        if(!Array.isArray(w[activity])) return;
        const old=JSON.stringify(w[activity]);
        const fixed=normalizeRecords(alliance,activity,w[activity]);
        if(old!==JSON.stringify(fixed)){ w[activity]=fixed; changed=true; }
      });
    });
  });
  return changed;
}

const DB_NAME = "qq271_alliance_local_db";
const DB_VERSION = 1;
const STORE = "state";
let db = null;

function setStorageStatus(text, ok=true){
  const el = document.getElementById("storageStatus");
  if(!el) return;
  el.textContent = text;
  el.style.borderColor = ok ? "#efb1cd" : "#efb6c2";
  el.style.background = ok ? "#fff0f6" : "#fff0f3";
  el.style.color = ok ? "#a33f6b" : "#b5425f";
}

function openDB(){
  return new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{
      const d = req.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
    };
    req.onsuccess = ()=>{ db=req.result; resolve(db); };
    req.onerror = ()=>reject(req.error || new Error("IndexedDB open failed"));
  });
}

function idbGet(key){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

function idbSet(key,value){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
    tx.objectStore(STORE).put(value,key);
  });
}

    for(const k of ["qq271_alliance_v58_state","qq271_alliance_v5_state","qq271_alliance_v4_state","qq271_alliance_v3_state","qq271_alliance_v2_state"]){
      try{

            await idbSet(KEY,state); setStorageStatus("✓ 已迁移旧版本地数据"); return;
          }
        }
      }catch(e){}
      try{
        const raw=localStorage.getItem(k);
        if(raw){
          state=JSON.parse(raw); state.version=5.9; mergeSeedAdditionsIntoState();
          if(db) await idbSet(KEY,state);
          localStorage.setItem(KEY,JSON.stringify(state));
          setStorageStatus("✓ 已迁移旧版本地数据"); return;
        }
      }catch(e){}
    }

    state=clone(SEED); state.version=5.9;
    try{ if(db) await idbSet(KEY,state); }catch(e){}
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}

function esc(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function weekMeta(key){
  const m=/^(\d{4})-W(\d{1,2})$/.exec(String(key||""));
  if(!m) return null;
  const year=Number(m[1]), week=Number(m[2]);
  const jan4=new Date(Date.UTC(year,0,4));
  const jan4Day=jan4.getUTCDay()||7;
  const start=new Date(jan4);
  start.setUTCDate(jan4.getUTCDate()-(jan4Day-1)+(week-1)*7);
  const end=new Date(start); end.setUTCDate(start.getUTCDate()+6);
  return {year,week,start,end};
}
function md(d){ return `${d.getUTCMonth()+1}月${d.getUTCDate()}日`; }
function weekShortLabel(key){
  const x=weekMeta(key); if(!x) return String(key||"");
  const range=x.start.getUTCFullYear()===x.end.getUTCFullYear()
    ? `${md(x.start)}-${md(x.end)}`
    : `${x.start.getUTCFullYear()}年${md(x.start)}-${x.end.getUTCFullYear()}年${md(x.end)}`;
  return `${range} · 第${x.week}周`;
}
function weekFullLabel(key){
  const x=weekMeta(key); if(!x) return String(key||"");
  const sy=x.start.getUTCFullYear(), ey=x.end.getUTCFullYear();
  const range=sy===ey
    ? `${sy}年${md(x.start)}-${md(x.end)}`
    : `${sy}年${md(x.start)}-${ey}年${md(x.end)}`;
  return `${range} 周数据（第${x.week}周）`;
}
function fmtWan(v){

function hasActivity(w,name){

function maxAvailableScoreFor(x){

  if(hasActivity(x,"推进城")) m += w.advance;
  if(hasActivity(x,"岛屿激斗")) m += w.island;

}
function maxAvailableScore(){ return maxAvailableScoreFor(W()); }
function islandContribution(record){

function islandScorePoints(record,settings=state.settings){
  const contribution=islandContribution(record);
  // 新规则：1200及以上=岛屿满分；900-1199=满分的1/3；900以下不计分。
  if(contribution>=1200) return settings.weights.island;
  if(contribution>=900) return settings.weights.island/3;

function islandTierLabel(record){

function memberStatsForWeek(name,weekKey=currentWeek,alliance=currentAlliance){
  const x=state.alliances?.[alliance]?.weeks?.[weekKey] || {}, s=state.settings;
  const p=(x["每日祈福"]||[]).find(r=>r.name===name);
  const a=(x["推进城"]||[]).find(r=>r.name===name);
  const i=(x["岛屿激斗"]||[]).find(r=>r.name===name);
  let score=0;
  if(p && Number.isFinite(Number(p.days))) score += s.weights.prayer * Math.max(0,Math.min(7,Number(p.days)))/7;
  if(a){
    const mx=Math.max(1,...(x["推进城"]||[]).map(r=>Number(r.total_wan||0)));
    const frac=Math.sqrt(Math.max(0,Number(a.total_wan||0))/mx);
    score += Math.min(s.weights.advance, s.advanceBase + s.advanceDamage*frac);
  }
  if(i) score += islandScorePoints(i,s);
  return {p,a,i,score};

function recordedWeeks(alliance=currentAlliance){
  const weeks=state.alliances?.[alliance]?.weeks || {};

    const w=weeks[k];
    return ["每日祈福","推进城","岛屿激斗"].some(a=>hasActivity(w,a));
  }).sort();
}
function averageMemberScore(name,alliance=currentAlliance){
  const weeks=recordedWeeks(alliance);
  const values=[];
  const removedAfter=state.alliances?.[alliance]?.memberMeta?.[name]?.removedAfterWeek || null;
  for(const wk of weeks){
    if(removedAfter && wk>removedAfter) continue;
    const w=state.alliances[alliance].weeks[wk] || {};
    const max=maxAvailableScoreFor(w);
    if(max<=0) continue;
    const raw=memberStatsForWeek(name,wk,alliance).score;
    values.push(raw/max*100);
  }
  return {
    average: values.length ? values.reduce((a,b)=>a+b,0)/values.length : null,
    weeksCount: values.length

    .sort((a,b)=>Number(b.active)-Number(a.active) || (b.average??-1)-(a.average??-1) || b.score-a.score);
  window._memberRows=rows.map(r=>r.name);
  document.getElementById("page-members").innerHTML=`
  <div class="panel">
    <div class="section-head"><div><h2>成员 · ${esc(currentAlliance)}</h2><div class="muted small">当前成员 ${activeSet.size} 人，已移出 ${inactiveSet.size} 人。移出成员保留历史活动记录。</div></div>
      <input class="input search" placeholder="搜索成员" value="${esc(q)}" oninput="window._memberQuery=this.value;renderMembers()">
    </div>
    <div class="row" style="margin:10px 0 14px">
      <button class="btn ${filter==="active"?"primary":"ghost"}" onclick="window._memberStatusFilter='active';renderMembers()">当前成员</button>
      <button class="btn ${filter==="inactive"?"primary":"ghost"}" onclick="window._memberStatusFilter='inactive';renderMembers()">已移出</button>
      <button class="btn ${filter==="all"?"primary":"ghost"}" onclick="window._memberStatusFilter='all';renderMembers()">全部</button>
    </div>
    <div class="tablewrap"><table><thead><tr><th>成员</th><th>状态</th><th>本周祈福</th><th>本周推进城</th><th>本周岛屿</th><th>平均评分</th><th>统计周数</th>${admin?"<th>管理</th>":""}</tr></thead><tbody>
      ${rows.map((r,idx)=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="tag ${r.active?"good":"pending"}">${r.active?"在盟":"已移出"}</span></td><td>${r.p?(r.p.days==null?"待确认":r.p.days+"天"):"未出现"}</td><td>${r.a?fmtWan(r.a.total_wan):"未出现"}</td><td>${r.i?`${Math.round(islandContribution(r.i))} · ${islandTierLabel(r.i)}`:"未出现"}</td><td class="score">${r.average==null?"—":r.average.toFixed(1)}</td><td>${r.weeksCount}</td>${admin?`<td><div class="row" style="flex-wrap:nowrap"><button class="btn ghost" onclick="renameMemberAt(${idx})">改名</button><button class="btn ${r.active?"danger":"primary"}" onclick="toggleMemberAt(${idx})">${r.active?"移出":"恢复"}</button></div></td>`:""}</tr>`).join("")}
    </tbody></table></div>
  </div>
  ${admin?`<div class="panel"><h2>成员库维护</h2><div class="row"><input id="newMember" class="input" style="max-width:300px" placeholder="输入新成员昵称"><button class="btn primary" onclick="addMember()">添加到当前同盟</button></div><div class="muted small" style="margin-top:8px">如果昵称已在“已移出”名单中，再次添加会直接恢复为当前成员。</div></div>`:""}`;
}
function addMember(){
  if(!requireAdmin()) return;
  const el=document.getElementById("newMember"), n=canonicalName(currentAlliance,(el.value||"").trim());if(!n)return;
  ensureAlliance(currentAlliance);
  const a=A();
  a.inactiveMembers=(a.inactiveMembers||[]).filter(x=>x!==n);
  if(!a.roster.includes(n)) a.roster.push(n);
  if(a.memberMeta?.[n]) delete a.memberMeta[n].removedAfterWeek;
  a.roster.sort((x,y)=>x.localeCompare(y,"zh-CN"));saveState();el.value="";renderMembers();
}
function renameMemberAt(idx){
  if(!requireAdmin()) return;
  const oldName=(window._memberRows||[])[idx]; if(!oldName)return;
  const next=canonicalName(currentAlliance,(prompt("修改成员昵称",oldName)||"").trim());
  if(!next || next===oldName)return;
  const a=A();
  if(allKnownMembers().includes(next)){ alert("这个昵称已经存在，请先确认是否为同一成员。"); return; }
  a.roster=(a.roster||[]).map(n=>n===oldName?next:n);
  a.inactiveMembers=(a.inactiveMembers||[]).map(n=>n===oldName?next:n);
  if(a.memberMeta?.[oldName]){ a.memberMeta[next]=a.memberMeta[oldName]; delete a.memberMeta[oldName]; }
  Object.values(a.weeks||{}).forEach(w=>Object.values(w||{}).forEach(rows=>{
    if(Array.isArray(rows)) rows.forEach(r=>{ if(r?.name===oldName) r.name=next; });
  }));
  normalizeState(); saveState(); render();
}
function toggleMemberAt(idx){
  if(!requireAdmin()) return;
  const name=(window._memberRows||[])[idx]; if(!name)return;
  ensureAlliance(currentAlliance); const a=A(); const active=(a.roster||[]).includes(name);
  if(active){
    if(!confirm(`确认把「${name}」标记为已移出？历史活动记录会保留。`)) return;
    a.roster=a.roster.filter(n=>n!==name);
    if(!a.inactiveMembers.includes(name)) a.inactiveMembers.push(name);
    a.memberMeta[name]={...(a.memberMeta[name]||{}),removedAfterWeek:currentWeek};
  }else{
    a.inactiveMembers=(a.inactiveMembers||[]).filter(n=>n!==name);
    if(!a.roster.includes(name)) a.roster.push(name);
    if(a.memberMeta?.[name]) delete a.memberMeta[name].removedAfterWeek;
  }
  a.roster.sort((x,y)=>x.localeCompare(y,"zh-CN"));
  a.inactiveMembers.sort((x,y)=>x.localeCompare(y,"zh-CN"));
  saveState(); render();
}
function renderSettings(){
  const s=state.settings;
  document.getElementById("page-settings").innerHTML=`
  <div class="panel"><h2>云端管理</h2>
    <div class="notice ok">当前管理员：${esc(ADMIN_EMAIL)}。管理员的导入、成员编辑与恢复操作会保存到 Supabase，其他访客刷新后读取同一份数据。</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="adminEntry()">退出管理员登录</button><button class="btn primary" onclick="saveState()">立即同步云端</button></div>
  </div>
  <div class="panel"><h2>备份与恢复</h2>
    <div class="notice ok">建议每次更新 HTML 或 APK 前先导出一次完整备份。安装新版后，如果本地数据没有自动保留，可直接导入这个 JSON 恢复。</div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" onclick="downloadBackup()">导出完整备份</button>
      <label class="btn ghost" style="display:inline-flex;align-items:center">导入备份<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0])"></label>
    </div>
    <div class="muted small" style="margin-top:10px">备份包含两个同盟、所有周次、成员库、活动记录和设置。</div>
  </div>
  <div class="panel"><h2>周评分规则（草案）</h2>
    <div class="notice">每一周先按当周已录入活动计算周评分，再统一折算到100分；成员页面和总览显示所有已录入周次的平均评分。岛屿激斗不再区分“到场 / 全程”，只按本盟贡献值分档：≥1200为满分，900-1199为1/3满分，900以下忽略不计。</div>
    <div class="cards" style="margin-top:10px">
      <div class="member-card"><div class="kv"><span>每日祈福满分</span><span>${s.weights.prayer}分</span></div><div class="kv"><span>推进城满分</span><span>${s.weights.advance}分</span></div><div class="kv"><span>岛屿激斗满分</span><span>${s.weights.island}分</span></div></div>
      <div class="member-card"><div class="kv"><span>推进城基础参与</span><span>${s.advanceBase}分</span></div><div class="kv"><span>推进城伤害加成</span><span>最高${s.advanceDamage}分</span></div><div class="kv"><span>岛屿贡献 ≥1200</span><span>${s.weights.island}分</span></div><div class="kv"><span>岛屿贡献 900-1199</span><span>${(s.weights.island/3).toFixed(0)}分</span></div><div class="kv"><span>岛屿贡献 &lt;900</span><span>0分</span></div></div>
    </div>
  </div>
  <div class="panel"><h2>数据保存说明</h2>
    <div class="notice ok">V5.9 以 Supabase 云端数据为主，同时在当前设备保留 IndexedDB / localStorage 缓存。云端临时不可用时仍可查看最近一次缓存。</div>
  </div>
  <div class="panel"><h2>危险操作</h2><button class="btn danger" onclick="resetDemo()">恢复V5.9初始数据</button></div>`;
}
function downloadBackup(){
  const payload=JSON.stringify(state,null,2);
  if(window.Android && typeof Android.saveBackup === "function"){
    Android.saveBackup(payload);
    return;
  }
  const blob=new Blob([payload],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="QQ271同盟数据备份.json";a.click();URL.revokeObjectURL(a.href);
}
function restoreBackup(file){
  if(!requireAdmin()) return;
  if(!file)return;const fr=new FileReader();fr.onload=()=>{try{state=JSON.parse(fr.result);normalizeState();saveState();currentAlliance=Object.keys(state.alliances)[0];render();alert("恢复完成");}catch(e){alert("备份文件无效");}};fr.readAsText(file);
}
function resetDemo(){
  if(!requireAdmin()) return;
  if(confirm("确认恢复初始演示数据？当前本地数据会被覆盖。")){state=clone(SEED);saveState();currentAlliance="271超级一组";currentWeek="2026-W39";go("overview");}
}
(async function bootstrap(){
  await initCloud();
  await loadState();
  const changed=normalizeState();
  if(changed){
    try{ if(db) await idbSet(KEY,state); }catch(e){}
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
    if(isAdmin()) await saveCloudState();
  }
  subscribeCloud();
  refreshAdminUI();
  if(!isAdmin()) setCloudStatus("访客模式 · 云端只读","online");
  render();
})();
</script>
</body>
</html>
